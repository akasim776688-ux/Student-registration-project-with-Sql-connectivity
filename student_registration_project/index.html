<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }
        .container {
            max-width: 520px;
            margin: 55px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; text-align: center; color: #173b70; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin: 16px 0 7px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }
        button {
            width: 100%;
            margin-top: 23px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1e40af; }
        .hint { font-size: 13px; text-align: left; margin-top: 16px; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Student Registration</h1>
        <p>Enter your details to register.</p>

        <form action="submit.php" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" maxlength="100" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" maxlength="150" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" maxlength="25" required>

            <label for="course">Select Course</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
            </select>

            <button type="submit">Register Student</button>
        </form>
        <p class="hint">Your information will be saved in the student database.</p>
    </main>
</body>
</html>
